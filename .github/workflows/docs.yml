name: Documentación
on:
  push:
    branches: [main]
    paths: ['docs/**', 'resources/transitions/**', 'specs/transiciones/viditor-transitions.d.ts']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # La referencia de la API (TypeDoc) se genera aquí cuando exista (fase 4): npm run docs:api
      - run: npm run docs:build:pages
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs/.vitepress/dist }
      - id: deployment
        uses: actions/deploy-pages@v4
