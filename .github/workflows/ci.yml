name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      # Las builds de docs generan la referencia (TypeDoc) que algunos tests comprueban
      - run: npm run docs:build:app
      - run: npm run docs:build:pages
      - run: npm test
      - run: npm run build
      # Incluye el test e2e obligatorio "sin red" (specs/02 §Autocontenido).
      - name: e2e (Linux, pantalla virtual)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test
      - name: e2e (Windows)
        if: runner.os == 'Windows'
        run: npx playwright test
