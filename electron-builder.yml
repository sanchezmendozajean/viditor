appId: dev.viditor.app
productName: Viditor
directories:
  output: release
files:
  - out/**/*
  - package.json
  - '!**/*.map'
extraResources:
  - from: resources/ffmpeg/${platform}
    to: ffmpeg/${platform}
  - from: resources/docs
    to: docs
  - from: resources/licenses
    to: licenses
  - from: resources/transitions
    to: transitions
fileAssociations:
  - ext: vdproj
    name: Proyecto de Viditor
    description: Proyecto de Viditor
win:
  target: [nsis, portable]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb]
  category: AudioVideo
  maintainer: Viditor
